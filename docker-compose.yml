services:
  openclaw-gateway:
    build:
      context: .
      args:
        MAC_HOME: ${HOME}
    image: openclaw-local:latest
    container_name: openclaw-gateway
    restart: unless-stopped

    ports:
      # Mac:18789 → container:18790 (socat) → openclaw 127.0.0.1:18789 (loopback, no pairing)
      - "127.0.0.1:18789:18790"

    volumes:
      # Single mount — container home is /Users/deanhiller so this path matches Mac exactly.
      # All hardcoded paths in openclaw.json, exec-approvals.json, etc. resolve identically.
      - "${HOME}/.openclaw:/Users/deanhiller/.openclaw"
      # Repo workspace — mounted at the same path as on Mac so file references match exactly
      - "${OPENCLAW_WORKSPACE:-/Users/deanhiller/openclaw}:${OPENCLAW_WORKSPACE:-/Users/deanhiller/openclaw}"

    # Allows container to reach host Chrome via host.docker.internal:9222
    extra_hosts:
      - "host.docker.internal:host-gateway"

    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
