services:
  openclaw-gateway:
    build:
      context: .
      args:
        MAC_HOME: ${HOME}
    image: openclaw-${COMPOSE_PROJECT_NAME:-local}:latest
    container_name: ${COMPOSE_PROJECT_NAME:-openclaw}-gateway
    restart: unless-stopped

    ports:
      # Mac:18789 → container:18790 (socat) → openclaw 127.0.0.1:18789 (loopback, no pairing)
      - "127.0.0.1:18789:18790"

    volumes:
      # Container home is ${HOME} (matched via MAC_HOME build arg above), so
      # every host path resolves to the identical path inside the container.
      # Hardcoded paths in openclaw.json, exec-approvals.json, etc. just work.
      - "${HOME}/.openclaw:${HOME}/.openclaw"
      # Claude Code persistent state — ~/.claudeDocker on the host mirrors the
      # container's $HOME layout (.claude/, .claude.json, .claude-mem/, .local/).
      # Isolated from the host Mac's ~/.claude to avoid credential/version
      # conflicts. See ~/.claudeDocker/README.md for the layout documentation.
      - "${HOME}/.claudeDocker/.claude:${HOME}/.claude"
      - "${HOME}/.claudeDocker/.claude.json:${HOME}/.claude.json"
      # Claude Code native binary + auto-updates — persisted on Mac so updates
      # survive container restarts. Seeded from the image on first run.
      - "${HOME}/.claudeDocker/.local/bin:${HOME}/.local/bin"
      - "${HOME}/.claudeDocker/.local/share/claude:${HOME}/.local/share/claude"
      # Third-party memory plugin (claude-mem) SQLite DB — persisted so context survives restarts
      - "${HOME}/.claudeDocker/.claude-mem:${HOME}/.claude-mem"
      # Repo workspace — mounted at the same path as on Mac so file references match exactly
      - "${OPENCLAW_WORKSPACE:-${HOME}/openclaw}:${OPENCLAW_WORKSPACE:-${HOME}/openclaw}"

    # Allows container to reach host Chrome via host.docker.internal:9222
    extra_hosts:
      - "host.docker.internal:host-gateway"

    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
